name: DL-07 Isolated Browser Visual Audit

on:
  push:
    branches:
      - phase2-p0-ui-fixes
    paths:
      - .github/workflows/dl07-browser-visual-audit.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: dl07-browser-visual-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download existing isolated Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 42436118367
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: _site

      - name: Extract Pages site archive
        run: |
          set -euo pipefail
          test -s _site/artifact.tar
          tar -xf _site/artifact.tar -C _site
          test -s _site/v9-pro-latest.html

      - name: Verify audit target exists
        run: |
          set -euo pipefail
          test -s _site/v9-pro-latest.html
          echo "Audit target: _site/v9-pro-latest.html"
          sha256sum _site/v9-pro-latest.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run six-tab Desktop and Mobile visual audit
        env:
          DASHBOARD_HTML: _site/v9-pro-latest.html
          AUDIT_OUT: artifacts/dl07-browser-visual-audit
        run: node tests/browser_dashboard_audit.mjs

      - name: Verify repository outputs remain unchanged
        if: always()
        run: git diff --exit-code -- data_reports/ dashboards/

      - name: Upload Desktop and Mobile screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dl07-browser-visual-audit-${{ github.run_id }}
          path: artifacts/dl07-browser-visual-audit/
          if-no-files-found: warn
          retention-days: 7
