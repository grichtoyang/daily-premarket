name: daily-data

on:
  schedule:
    - cron: '0 0 * * 1-5'   # UTC 00:00 = Asia/Taipei 平日 08:00：T0 自動判定
    - cron: '0 11 * * 1-5'     # UTC 11:00 = Asia/Taipei 平日 19:00：T0=當日 日盤版
    - cron: '0 0 * * 6'     # UTC 00:00 = Asia/Taipei 週六 08:00：T0=週五 全日版 (夜盤已收)
  workflow_dispatch:
    inputs:
      t0:
        description: 'T0 交易日期 YYYY-MM-DD (空白=自動)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch daily data
        timeout-minutes: 18
        run: |
          echo "PYTHONUNBUFFERED=1" >> $GITHUB_ENV
          TODAY=$(TZ=Asia/Taipei date +%F)
          echo "TODAY=$TODAY" >> $GITHUB_ENV
          # 排定班別釘死（用觸發的 cron 精確匹配，不看牆鐘；手動觸發則留空走自動判定）
          SCHED='${{ github.event.schedule }}'
          case "$SCHED" in
            '0 0 * * 1-5') SLOT=morning;;
            '0 0 * * 6') SLOT=weekend;;
            '0 11 * * 1-5') SLOT=evening;;
            *) SLOT='';;
          esac
          START_TS=$(date +%s)
          # 只認本輪新寫的檔（不用 ls -t 取最新：fetch 全滅時會誤拿昨天的檔，
          # grep 舊檔必然通過→靜默跳過，2026-10-14 早上教訓）
          for i in 1 2; do
            if timeout 480 python src/fetch_data.py --date "$TODAY" --t0 "${{ inputs.t0 }}" ${SLOT:+--slot "$SLOT"}; then
              echo "fetch attempt $i rc=0"
            else
              echo "fetch attempt $i failed/timed out (rc=$?)"
            fi
            T0FILE=$(find data_reports -name 'DATA_REPORT_*.md' -newermt "@$START_TS" | head -1)
            if [ -n "$T0FILE" ] && grep -q "| 融資維持率 | [0-9]" "$T0FILE"; then
              echo "margin ratio ok on attempt $i ($T0FILE)"
              echo "T0FILE=$T0FILE" >> $GITHUB_ENV
              break
            fi
            echo "fetch incomplete, attempt $i/2; sleep 90s"
            sleep 90
          done
          if [ -z "${T0FILE:-}" ]; then
            echo "FATAL: no fresh DATA produced; failing loudly (do not silent-skip)"
            exit 1
          fi
      # 分析層：半自動（人工貼 DATA 給 OpenCode 寫 Daily_REPORT），全自動管線保留在 src/analyze.py，日後啟用
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_reports/ reports/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            if [ -z "${T0FILE:-}" ]; then echo "no T0FILE ref"; exit 1; fi
            # 訊息用 T0（檔名基準）而非 DATE，避免休市日訊息與檔案不符
            T0=$(basename "$T0FILE" .md | sed 's/DATA_REPORT_//')
            git commit -m "chore(data): DATA_REPORT_${T0}"
            git push
          fi
