name: daily-data

on:
  schedule:
    - cron: '0 0 * * 1-5'   # UTC 00:00 = Asia/Taipei 08:00 (週一~週五)：前一日 T0 全日版
    - cron: '0 6 * * 5'     # UTC 06:00 = Asia/Taipei 週五 14:00：當日 T0 日盤版
  workflow_dispatch:
    inputs:
      t0:
        description: 'T0 交易日期 YYYY-MM-DD (空白=自動)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch daily data
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          echo "TODAY=$TODAY" >> $GITHUB_ENV
          # 13:45 後的場次 (如週五收盤場) T0 取今天，否則自動取最近交易日
          HHMM=$(TZ=Asia/Taipei date +%H%M)
          if [ -z "${{ inputs.t0 }}" ] && [ "$HHMM" -ge 1345 ]; then
            T0="$TODAY"
          else
            T0="${{ inputs.t0 }}"
          fi
          python src/fetch_data.py --date "$TODAY" --t0 "$T0"
      # 分析層：半自動（人工貼 DATA 給 OpenCode 寫 Daily_REPORT），全自動管線保留在 src/analyze.py，日後啟用
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_reports/ reports/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            DATE=$(TZ=Asia/Taipei date +%Y%m%d)
            git commit -m "chore(data): DATA_REPORT_${DATE} + Daily_REPORT"
            git push
          fi
