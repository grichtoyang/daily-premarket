name: daily-data

on:
  schedule:
    - cron: '0 0 * * 1-5'   # UTC 00:00 = Asia/Taipei 平日 08:00：T0 自動判定
    - cron: '0 6 * * 5'     # UTC 06:00 = Asia/Taipei 週五 14:00：T0=當日 日盤版
    - cron: '0 0 * * 6'     # UTC 00:00 = Asia/Taipei 週六 08:00：T0=週五 全日版 (夜盤已收)
  workflow_dispatch:
    inputs:
      t0:
        description: 'T0 交易日期 YYYY-MM-DD (空白=自動)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch daily data
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          echo "TODAY=$TODAY" >> $GITHUB_ENV
          # T0 缺省由 src/t0.py 判定 (13:45/假日/週末規則)；手動觸發可指定 t0
          python src/fetch_data.py --date "$TODAY" --t0 "${{ inputs.t0 }}"
      # 分析層：半自動（人工貼 DATA 給 OpenCode 寫 Daily_REPORT），全自動管線保留在 src/analyze.py，日後啟用
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_reports/ reports/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            DATE=$(TZ=Asia/Taipei date +%Y%m%d)
            git commit -m "chore(data): DATA_REPORT_${DATE}"
            git push
          fi
