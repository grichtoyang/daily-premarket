name: V9 UI Fixes Regression

on:
  push:
    branches:
      - phase2-p0-ui-fixes
    paths:
      - "scripts/v9_pro_builder.py"
      - "src/fetch_data.py"
      - "tests/test_dashboard_unit_contract.py"
      - "docs/DATA_REPORT_TEMPLATE.md"
      - "templates/v9-pro-react-template.html"
      - "tests/test_builder_option_tables.py"
      - "tests/test_react_template_static.py"
      - ".github/workflows/test-v9-ui-fixes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-ui-fixes-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout UI fixes branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run V9 builder offline self-tests
        run: python scripts/v9_pro_builder.py --self-test

      - name: Install Acorn JavaScript parser
        run: npm install --prefix /tmp/v9-js-parser acorn

      - name: Run React template regression tests
        env:
          NODE_PATH: /tmp/v9-js-parser/node_modules
        run: python -m unittest discover -s tests -p "test_react_template_static.py" -v

      - name: Run DATA_REPORT parser regression tests
        run: python -m unittest discover -s tests -p "test_builder_option_tables.py" -v

      - name: Build dashboard JSON and verify borrowed securities fields
        run: |
          set -euo pipefail
          python scripts/v9_pro_builder.py --data_report "data_reports/DATA_REPORT_20261030.md" --out "dashboards/v9-ui-fixes-data.json" --date "20261030"
          python -m json.tool dashboards/v9-ui-fixes-data.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("dashboards/v9-ui-fixes-data.json").read_text(encoding="utf-8"))
          margin = data["margin"]
          assert margin["borrowedSell"] == 36178.0, margin
          assert margin["borrowedSellDiff"] == -1273.0, margin
          assert margin["borrowedSellDiffScope"] == "上櫃（上市 TWT93U 未取得）", margin
          options = data["options"]
          assert len(options["instOpt"]) >= 3
          assert options["gexStatus"] == "available", options
          assert options["gexDate"] == "2026-10-30", options["gexDate"]
          assert len(options["gexLevels"]) == 139, len(options["gexLevels"])
          assert abs(options["netGex1pct"] - 1294327419.0091748) < 1.0, options["netGex1pct"]
          assert abs(options["grossGex1pct"] - 6320130202.132608) < 1.0, options["grossGex1pct"]
          net_sum = sum(float(level["net_gex_1pct"]) for level in options["gexLevels"])
          gross_sum = sum(float(level["gross_gex_1pct"]) for level in options["gexLevels"])
          assert abs(net_sum - options["netGex1pct"]) < 1.0, (net_sum, options["netGex1pct"])
          assert abs(gross_sum - options["grossGex1pct"]) < 1.0, (gross_sum, options["grossGex1pct"])
          print("GEX_PIPELINE=PASS", options["gexStatus"], options["gexDate"], len(options["gexLevels"]))
          print("GEX_TOTALS=PASS", round(net_sum, 2), round(gross_sum, 2))
          print("BORROWED_SELL_BALANCE=PASS", margin["borrowedSell"])
          print("BORROWED_SELL_CHANGE_SCOPE=PASS", margin["borrowedSellDiff"], margin["borrowedSellDiffScope"])
          print("OPTIONS_INSTITUTIONAL_TABLE=PASS")
          PY

      - name: Generate non-deploy HTML preview
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          template_path = Path("templates/v9-pro-react-template.html")
          data_path = Path("dashboards/v9-ui-fixes-data.json")
          template = template_path.read_text(encoding="utf-8")
          data = json.loads(data_path.read_text(encoding="utf-8"))
          if "var vf=window.DASHBOARD_DATA;" not in template:
              raise SystemExit("React template must consume injected DATA_REPORT JSON")
          payload = json.dumps(data, ensure_ascii=False, separators=(",", ":")).replace("</", "<\\/")
          injection = f"<script>window.DASHBOARD_DATA={payload};</script>" + chr(10)
          if "</head>" not in template:
              raise SystemExit("React template closing head missing")
          html = template.replace("</head>", injection + "</head>", 1)
          output = Path("artifacts/v9-pro-ui-fixes-preview-20261030.html")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(html, encoding="utf-8")
          if "window.DASHBOARD_DATA=" not in html:
              raise SystemExit("Preview data injection failed")
          print("NON_DEPLOY_HTML_PREVIEW=PASS", output.stat().st_size)
          PY

      - name: Generate isolated valid-correlation heatmap fixture
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          template = Path("templates/v9-pro-react-template.html").read_text(encoding="utf-8")
          data = json.loads(Path("dashboards/v9-ui-fixes-data.json").read_text(encoding="utf-8"))
          labels = ["大盤漲跌幅", "外資現貨", "外資期貨", "選擇權 PCR", "VIX", "RSI", "KD-K", "KD-D"]
          matrix = [
              [1.00, 0.90, 0.75, -0.30, -0.65, 0.55, 0.40, 0.35],
              [0.90, 1.00, 0.80, -0.25, -0.60, 0.50, 0.45, 0.40],
              [0.75, 0.80, 1.00, -0.20, -0.50, 0.45, 0.35, 0.30],
              [-0.30, -0.25, -0.20, 1.00, 0.35, -0.40, -0.20, -0.15],
              [-0.65, -0.60, -0.50, 0.35, 1.00, -0.55, -0.35, -0.30],
              [0.55, 0.50, 0.45, -0.40, -0.55, 1.00, 0.85, 0.80],
              [0.40, 0.45, 0.35, -0.20, -0.35, 0.85, 1.00, 0.92],
              [0.35, 0.40, 0.30, -0.15, -0.30, 0.80, 0.92, 1.00],
          ]
          assert len(matrix) == len(labels) == 8
          assert all(len(row) == 8 for row in matrix)
          data.setdefault("analysis", {})["correlation"] = {
              "labels": labels,
              "matrix": matrix,
              "desc": "測試資料：8 個欄位、6 筆有效樣本（非正式歷史數據）"
          }
          payload = json.dumps(data, ensure_ascii=False, separators=(",", ":")).replace("</", "<\\/")
          injection = f"<script>window.DASHBOARD_DATA={payload};</script>\\n"
          if "var vf=window.DASHBOARD_DATA;" not in template or "</head>" not in template:
              raise SystemExit("React template data injection anchors missing")
          html = template.replace("</head>", injection + "</head>", 1)
          banner = '<div style="position:fixed;z-index:99999;top:8px;left:8px;background:#7f1d1d;color:white;padding:8px 12px;border-radius:8px;font:12px sans-serif">測試資料預覽｜非正式歷史數據｜不得部署</div>'
          html = html.replace("</body>", banner + "</body>", 1)
          output = Path("artifacts/v9-pro-correlation-fixture.html")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(html, encoding="utf-8")
          print("CORRELATION_FIXTURE_HTML=PASS", output.stat().st_size)
          print("FIXTURE_MATRIX=8x8; SYNTHETIC_SAMPLE_COUNT=6; PRODUCTION_DB=UNCHANGED")
          PY

      - name: Upload isolated correlation fixture artifact
        uses: actions/upload-artifact@v4
        with:
          name: V9-Correlation-Heatmap-Test-Fixture
          path: artifacts/v9-pro-correlation-fixture.html
          if-no-files-found: error

      - name: Upload non-deploy HTML preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: V9-UI-Fixes-Preview-20261030
          path: artifacts/v9-pro-ui-fixes-preview-20261030.html
          if-no-files-found: error
