name: V9 Pro Unit Contract Audit

on:
  push:
    branches:
      - phase2-p0-ui-fixes
    paths:
      - '.github/workflows/unit-contract-audit.yml'
      - 'scripts/v9_pro_builder.py'
      - 'src/fetch_data.py'
      - 'src/sources/spot.py'
      - 'src/sources/spot_raw.py'
      - 'templates/v9-pro-react-template.html'
      - 'docs/DASHBOARD_UNIT_*.md'
      - 'docs/DATA_REPORT_TEMPLATE.md'
      - 'docs/ANA_REPORT_TEMPLATE.md'
      - 'skills/daily-premarket-analysis-v9-pro-skill.md'
      - 'tests/test_dashboard_unit_contract.py'
      - 'tests/test_builder_option_tables.py'
      - 'tests/test_builder_option_force_analysis.py'
      - 'tests/test_react_template_static.py'
      - 'tests/test_taifex_night_unavailable_summary.py'
      - 'tests/test_fetch_data_borrowed_sources.py'
      - 'tests/test_spot_borrowed_semantics.py'
      - 'tests/test_spot_borrowed_live.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  live-borrowed-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP dependency
        run: python -m pip install requests
      - name: Verify official TWSE and TPEx historical sources for 2026-10-30
        run: python -m unittest discover -s tests -p 'test_spot_borrowed_live.py' -v

  unit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts src tests
      - name: Run borrowed-securities source and semantic regression tests
        run: |
          python -m unittest discover -s tests -p 'test_fetch_data_borrowed_sources.py' -v
          python -m unittest discover -s tests -p 'test_spot_borrowed_semantics.py' -v
      - name: Run Dashboard unit contract tests
        run: python -m unittest discover -s tests -p 'test_dashboard_unit_contract.py' -v
      - name: Run DATA_REPORT and field-semantic regression tests
        run: |
          python -m unittest discover -s tests -p 'test_builder_option_tables.py' -v
          python -m unittest discover -s tests -p 'test_builder_option_force_analysis.py' -v
      - name: Run React template regression tests
        run: python -m unittest discover -s tests -p 'test_react_template_static.py' -v
      - name: Run TAIFEX night unavailable summary regression tests
        run: python -m unittest discover -s tests -p 'test_taifex_night_unavailable_summary.py' -v
