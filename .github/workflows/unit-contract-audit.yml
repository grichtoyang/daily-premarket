name: V9 Pro Unit Contract Audit

on:
  push:
    branches:
      - phase2-p0-ui-fixes
    paths:
      - 'scripts/v9_pro_builder.py'
      - 'templates/v9-pro-react-template.html'
      - 'docs/DASHBOARD_UNIT_*.md'
      - 'docs/DATA_REPORT_TEMPLATE.md'
      - 'docs/ANA_REPORT_TEMPLATE.md'
      - 'skills/daily-premarket-analysis-v9-pro-skill.md'
      - 'tests/test_dashboard_unit_contract.py'
      - 'tests/test_react_template_static.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run Dashboard unit contract tests
        run: python -m unittest tests/test_dashboard_unit_contract.py -v
      - name: Run React template regression tests
        run: python -m unittest tests/test_react_template_static.py -v
