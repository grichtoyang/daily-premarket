name: P0 Listed Maintenance Ratio Tests

on:
  push:
    branches:
      - phase2-p0-data-quality
    paths:
      - "src/sources/listed_maint_ratio.py"
      - "tests/test_listed_maint_ratio.py"
      - ".github/workflows/test-listed-maint-ratio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v4
        with:
          ref: phase2-p0-data-quality
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run listed maintenance ratio tests
        run: python -m unittest discover -s tests -p "test_listed_maint_ratio.py" -v
      - name: Probe live TWSE payload schema (2026-10-30)
        run: |
          python - <<'PY'
          import requests
          base = "https://www.twse.com.tw/rwd/zh"
          headers = {"User-Agent": "Mozilla/5.0", "Referer": "https://www.twse.com.tw/"}
          urls = [
              base + "/marginTrading/MI_MARGN?date=20261030&selectType=ALL&response=json",
              base + "/afterTrading/MI_INDEX?date=20261030&type=ALLBUT0999&response=json",
          ]
          for url in urls:
              r = requests.get(url, headers=headers, timeout=20)
              r.raise_for_status()
              j = r.json()
              print("URL:", url)
              print("top-level:", list(j) if isinstance(j, dict) else type(j).__name__)
              print("date/stat:", j.get("date"), j.get("stat"))
              for i, table in enumerate(j.get("tables", []) if isinstance(j, dict) else []):
                  fields = table.get("fields") or []
                  title = table.get("title", "")
                  if ("融資" in title or "信用" in title or
                      ("代號" in fields and ("融資今日餘額" in fields or "今日餘額" in fields)) or
                      ("證券代號" in fields and "收盤價" in fields)):
                      print("table", i, "title=", title, "fields=", fields,
                            "first_row=", (table.get("data") or [])[:1])
          PY

      - name: Calculate listed-only ratio for 2026-10-30
        run: |
          python - <<'PY'
          from src.sources.listed_maint_ratio import get
          result = get("2026-10-30", timeout=20)
          print(result)
          if not result.get("ok"):
              raise SystemExit("LIVE_LISTED_RATIO_FAILED: " + result.get("reason", "unknown"))
          PY

      - name: Diagnose financed symbols without MI_INDEX close
        if: always()
        run: |
          python - <<'PY'
          import requests
          h = {"User-Agent": "Mozilla/5.0", "Referer": "https://www.twse.com.tw/"}
          base = "https://www.twse.com.tw/rwd/zh"
          m = requests.get(base + "/marginTrading/MI_MARGN?date=20261030&selectType=ALL&response=json", headers=h, timeout=20).json()
          p = requests.get(base + "/afterTrading/MI_INDEX?date=20261030&type=ALLBUT0999&response=json", headers=h, timeout=20).json()
          mt = next(t for t in m["tables"] if "代號" in t.get("fields", []) and t.get("fields", []).count("今日餘額") >= 2)
          pt = next(t for t in p["tables"] if "證券代號" in t.get("fields", []) and "收盤價" in t.get("fields", []))
          mi, pi = mt["fields"].index("代號"), [i for i,x in enumerate(mt["fields"]) if x == "今日餘額"][0]
          pcode, pclose = pt["fields"].index("證券代號"), pt["fields"].index("收盤價")
          codes = {"00682U", "1470", "1589", "5906"}
          for row in mt["data"]:
              if row[mi] in codes:
                  print("MARGIN", row[mi], "financing_balance", row[pi], "name", row[1])
          for row in pt["data"]:
              if row[pcode] in codes:
                  print("PRICE", row[pcode], "close", row[pclose], "name", row[1])
          PY

      - name: Probe historical close fallback for unpriced financed symbols
        if: always()
        run: |
          python - <<'PY'
          import requests
          h = {"User-Agent": "Mozilla/5.0", "Referer": "https://www.twse.com.tw/"}
          for code in ("00682U", "1470", "1589", "5906"):
              url = f"https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date=20261001&stockNo={code}&response=json"
              r = requests.get(url, headers=h, timeout=20)
              r.raise_for_status()
              j = r.json()
              fields = j.get("fields", [])
              rows = j.get("data", [])
              print("STOCK_DAY", code, "stat=", j.get("stat"), "fields=", fields)
              for row in rows[-3:]:
                  print("ROW", code, row)
          PY

      - name: Check older STOCK_DAY history for residual margin balances
        if: always()
        run: |
          python - <<'PY'
          import requests
          h = {"User-Agent": "Mozilla/5.0", "Referer": "https://www.twse.com.tw/"}
          for month in ("20260901", "20260801", "20260701", "20260601"):
              url = f"https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date={month}&stockNo=1589&response=json"
              j = requests.get(url, headers=h, timeout=20).json()
              rows = j.get("data", [])
              valid = [r for r in rows if len(r) > 6 and r[6] not in ("--", "", None)]
              print("1589", month, "stat=", j.get("stat"), "last_valid=", valid[-1:] or "NONE")
          PY

      - name: Inspect latest valid historical close for missing-price securities
        if: always()
        run: |
          python - <<'PY'
          import requests
          h = {"User-Agent": "Mozilla/5.0", "Referer": "https://www.twse.com.tw/"}
          for code, month in (("00682U","20261001"),("1470","20261001"),("5906","20261001"),("1589","20260401")):
              url = f"https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date={month}&stockNo={code}&response=json"
              j = requests.get(url, headers=h, timeout=20).json()
              rows = [r for r in j.get("data", []) if len(r)>6 and r[6] not in ("--","","-")]
              print(code, "stat=", j.get("stat"), "last_valid=", rows[-1:] or "NONE")
          PY
