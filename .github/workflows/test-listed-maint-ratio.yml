name: P0 Listed Maintenance Ratio Tests

on:
  push:
    branches:
      - phase2-p0-data-quality
    paths:
      - "src/sources/listed_maint_ratio.py"
      - "tests/test_listed_maint_ratio.py"
      - ".github/workflows/test-listed-maint-ratio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v4
        with:
          ref: phase2-p0-data-quality
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run listed maintenance ratio tests
        run: python -m unittest discover -s tests -p "test_listed_maint_ratio.py" -v
