name: Blave Data Discovery Probe

on:
  push:
    branches:
      - phase2-p0-data-quality
    paths:
      - '.github/workflows/blave-access-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect page payload and referenced scripts
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          PAGE_URL = "https://blave.org/studio/twstock/zh/market/margin"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129.0.0.0 Safari/537.36",
              "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8",
              "Referer": "https://blave.org/",
          }

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.status, r.headers.get("Content-Type", ""), r.read()

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.srcs = []
                  self.inline = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      a = dict(attrs)
                      self.current = {"src": a.get("src"), "text": ""}
                      if self.current["src"]:
                          self.srcs.append(self.current["src"])
              def handle_data(self, data):
                  if self.current is not None and not self.current["src"]:
                      self.current["text"] += data
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      if not self.current["src"] and self.current["text"].strip():
                          self.inline.append(self.current["text"])
                      self.current = None

          status, ctype, raw = get(PAGE_URL)
          html = raw.decode("utf-8", "replace")
          print("PAGE_STATUS=", status, "CONTENT_TYPE=", ctype, "BYTES=", len(raw))
          title = re.search(r"<title[^>]*>(.*?)</title>", html, re.I | re.S)
          print("TITLE=", re.sub(r"\s+", " ", title.group(1)).strip() if title else "NOT_FOUND")

          parser = Scripts()
          parser.feed(html)
          print("EXTERNAL_SCRIPT_COUNT=", len(parser.srcs))
          print("INLINE_SCRIPT_COUNT=", len(parser.inline))

          terms = ["維持率", "融資餘額", "融資", "chart", "series", "api", "graphql", "json"]
          low = html.lower()
          for term in terms:
              print("TERM_COUNT", term, "=", low.count(term.lower()))

          # Print short source excerpts around ratio labels and likely serialized payloads.
          for term in ["維持率", "margin", "__next_data__", "__nuxt__", "application/json"]:
              pos = low.find(term.lower())
              if pos >= 0:
                  excerpt = re.sub(r"\s+", " ", html[max(0, pos-220):pos+420])
                  print("HTML_CONTEXT", term, "=", excerpt[:650])

          base = urllib.parse.urlparse(PAGE_URL)
          candidates = []
          for src in parser.srcs:
              full = urllib.parse.urljoin(PAGE_URL, src)
              if urllib.parse.urlparse(full).netloc == base.netloc:
                  candidates.append(full)
          print("SAME_ORIGIN_SCRIPTS=", len(candidates))
          for u in candidates[:20]:
              print("SCRIPT_URL=", u)

          # Search inline scripts and a bounded number of same-origin JS bundles for data endpoint references.
          patterns = [
              r"""https?://[^"'\s<>]+""",
              r"""["']((?:/|\./)[^"'\s]+(?:api|data|chart|margin|json)[^"'\s]*)["']""",
              r"""(?:fetch|axios\.get)\s*\(\s*["']([^"']+)["']""",
              r"""["']([^"']+\.json(?:\?[^"']*)?)["']""",
          ]
          texts = [("INLINE", x) for x in parser.inline]
          for u in candidates[:12]:
              try:
                  st, ct, b = get(u)
                  txt = b.decode("utf-8", "replace")
                  print("SCRIPT_FETCH=", st, ct, len(b), u)
                  texts.append((u, txt))
              except Exception as e:
                  print("SCRIPT_FETCH_ERROR=", u, type(e).__name__, str(e)[:160])

          seen = set()
          for label, txt in texts:
              found = []
              for pat in patterns:
                  for m in re.findall(pat, txt, re.I):
                      value = m if isinstance(m, str) else m[0]
                      if value.startswith(("http://", "https://", "/", "./")) and value not in seen:
                          seen.add(value)
                          found.append(value)
              for value in found[:30]:
                  print("DATA_REFERENCE=", label, value[:500])

          # Probe the first-party chart endpoint discovered in the page's own JavaScript.
          endpoint = "https://api.blave.org/studio/charts/twmarket/margin_maintenance"
          try:
              st, ct, payload = get(endpoint)
              print("RATIO_API_STATUS=", st, "CONTENT_TYPE=", ct, "BYTES=", len(payload))
              body = payload.decode("utf-8", "replace")
              print("RATIO_API_PREVIEW=", body[:1800].replace("\\n", " ")[:1800])
              try:
                  import json
                  obj = json.loads(body)
                  data = obj.get("data", []) if isinstance(obj, dict) else []
                  print("RATIO_API_TOP_KEYS=", list(obj.keys()) if isinstance(obj, dict) else type(obj).__name__)
                  print("RATIO_API_DATA_TYPE=", type(data).__name__, "COUNT=", len(data) if hasattr(data, "__len__") else "NA")
                  if isinstance(data, list) and data:
                      print("RATIO_API_FIRST_ROW=", json.dumps(data[0], ensure_ascii=False)[:1000])
                      print("RATIO_API_LAST_ROW=", json.dumps(data[-1], ensure_ascii=False)[:1000])
                      dates = [row.get("date") for row in data if isinstance(row, dict)]
                      values = [row.get("maintenance_ratio") for row in data if isinstance(row, dict)]
                      print("RATIO_DATE_RANGE=", dates[0], "TO", dates[-1])
                      print("RATIO_SORTED_ASC=", dates == sorted(dates))
                      print("RATIO_DUPLICATE_DATES=", len(dates) - len(set(dates)))
                      print("RATIO_NULL_VALUES=", sum(v is None for v in values))
                      meta = re.search(r"(\\d{4}-\\d{2}-\\d{2}) 上市融資維持率（估算）為 ([\\d,.]+)%", html)
                      if meta:
                          meta_date = meta.group(1)
                          meta_value = float(meta.group(2).replace(",", ""))
                          api_value = float(data[-1]["maintenance_ratio"])
                          print("PAGE_META_DATE_VALUE=", meta_date, meta_value)
                          print("API_LAST_DATE_VALUE=", data[-1]["date"], api_value)
                          print("PAGE_API_MATCH=", meta_date == data[-1]["date"] and round(meta_value, 2) == round(api_value, 2))
                      else:
                          print("PAGE_META_MATCH=NOT_FOUND")
              except Exception as e:
                  print("RATIO_API_JSON_ERROR=", type(e).__name__, str(e)[:200])
          except Exception as e:
              print("RATIO_API_ERROR=", type(e).__name__, str(e)[:300])

          # Look for numeric ratio-like payloads around relevant labels, without assuming a value.
          for label, txt in texts:
              lowtxt = txt.lower()
              for term in ["維持率", "融資維持率", "maintenance", "margin_ratio"]:
                  p = lowtxt.find(term.lower())
                  if p >= 0:
                      excerpt = re.sub(r"\s+", " ", txt[max(0,p-180):p+500])
                      print("SCRIPT_CONTEXT=", label, term, excerpt[:700])
          PY
