name: Blave Access Probe

on:
  push:
    branches:
      - phase2-p0-data-quality
    paths:
      - '.github/workflows/blave-access-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Blave Taiwan stock margin page
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          url = "https://blave.org/studio/twstock/zh/market/margin"
          profiles = {
              "default": {},
              "browser_like": {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8",
                  "Referer": "https://blave.org/",
              },
          }

          for name, headers in profiles.items():
              print("\\n=== PROFILE: " + name + " ===")
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      body = response.read()
                      page = body.decode("utf-8", errors="replace")
                      print("HTTP_STATUS=" + str(response.status))
                      print("FINAL_URL=" + response.geturl())
                      print("CONTENT_TYPE=" + str(response.headers.get("Content-Type")))
                      print("BODY_BYTES=" + str(len(body)))
              except urllib.error.HTTPError as exc:
                  body = exc.read()
                  page = body.decode("utf-8", errors="replace")
                  print("HTTP_STATUS=" + str(exc.code))
                  print("FINAL_URL=" + exc.geturl())
                  print("BODY_BYTES=" + str(len(body)))
                  print("HTTP_ERROR=" + str(exc.reason))
              except Exception as exc:
                  print("REQUEST_ERROR=" + type(exc).__name__ + ": " + str(exc))
                  continue

              title = "NOT_FOUND"
              if "<title" in page.lower():
                  title = page.lower().split("<title", 1)[1].split(">", 1)[-1].split("</title>", 1)[0]
              print("HTML_TITLE=" + title[:200])
              print("HAS_MARGIN_KEYWORD=" + str(any(x in page.lower() for x in ["margin", "融資", "融券", "維持率"])))
              print("HAS_CHALLENGE_MARKER=" + str(any(x in page.lower() for x in ["cloudflare", "just a moment", "captcha", "challenge"])))
              print("BODY_PREVIEW=" + " ".join(page[:500].split())[:300])
          PY
