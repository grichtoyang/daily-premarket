name: DL-07 Fetch Isolated Tests

on:
  push:
    branches:
      - phase2-p0-ui-fixes
    paths:
      - 'tests/test_fetch_data_borrowed_sources.py'
      - '.github/workflows/dl07-fetch-isolated-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dl07-fetch-isolated-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-main-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run only the isolated Fetch main success-path test
        run: |
          python3 <<'PY'
          import sys
          import unittest

          sys.path.insert(0, "tests")
          from test_fetch_data_borrowed_sources import DataReportWriteSafetyTests

          suite = unittest.TestSuite([
              DataReportWriteSafetyTests(
                  "test_main_writes_valid_report_in_isolated_output_dir"
              )
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print("PASS: Fetch main success path used mocked build and temporary OUT_DIR")
          PY

      - name: Confirm production report and Dashboard fixtures are unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- data_reports/ dashboards/
          echo "PASS: repository DATA_REPORT fixtures and Dashboard outputs unchanged"
