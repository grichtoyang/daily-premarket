name: DL-06 Isolated Retry Tests

on:
  push:
    branches:
      - phase2-p0-ui-fixes
    paths:
      - '.github/workflows/dl06-retry-tests.yml'

permissions:
  contents: read

jobs:
  isolated-retry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout test contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Run isolated mock retry scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          production = Path(".github/workflows/daily_data.yml").read_text(encoding="utf-8")
          required_contract = [
              'for i in 1 2',
              'FETCH_RC=0',
              'T0FILE=$(grep -F \'[OK] report_path=\'',
              'validate_data_report_file',
              'if [ -z "${T0FILE:-}" ]; then',
              'exit 1',
          ]
          missing = [item for item in required_contract if item not in production]
          if missing:
              raise SystemExit(f"Production retry contract changed; review required: {missing}")

          def run_mock_retry(outcomes, root):
              accepted = None
              for attempt, (fetch_rc, report_text, validator_ok) in enumerate(outcomes, start=1):
                  attempt_dir = root / f"attempt-{attempt}"
                  attempt_dir.mkdir(parents=True)
                  report = attempt_dir / "mock-report.md"
                  if report_text is not None:
                      report.write_text(report_text, encoding="utf-8")
                  report_path = report if report.exists() else None
                  if fetch_rc == 0 and report_path is not None and validator_ok:
                      accepted = report_path
                      break
              return accepted

          valid = "# DATA_REPORT_MOCK\nVALID"
          invalid = "# DATA_REPORT_MOCK\nINVALID"

          with TemporaryDirectory(prefix="dl06-retry-") as temp:
              root = Path(temp)

              # Case 1: first fetch fails; second fetch produces a valid report.
              result = run_mock_retry([(1, None, False), (0, valid, True)], root / "case-1")
              assert result is not None and result.parent.name == "attempt-2"
              print("PASS: fetch failure then success accepts attempt 2")

              # Case 2: first report fails validation; second report is valid.
              result = run_mock_retry([(0, invalid, False), (0, valid, True)], root / "case-2")
              assert result is not None and result.parent.name == "attempt-2"
              assert result.read_text(encoding="utf-8") == valid
              print("PASS: invalid first report then success accepts only attempt 2")

              # Case 3: both attempts fail; no report may be accepted.
              result = run_mock_retry([(1, None, False), (1, None, False)], root / "case-3")
              assert result is None
              print("PASS: two failures produce no accepted report")

          print("DL-06 isolated mock scenarios: 3/3 PASS")
          PY
