name: TAIFEX Options OI Python Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  options-oi-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run TAIFEX Options OI tests
        run: python -m unittest discover -s tests -p "test_taifex_options_oi_partial_coverage.py" -v
