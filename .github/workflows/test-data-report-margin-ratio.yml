name: P0 DATA_REPORT Margin Ratio Integration

on:
  push:
    branches:
      - phase2-p0-data-quality
    paths:
      - "src/sources/blave_maint_ratio.py"
      - "src/sources/spot.py"
      - "src/fetch_data.py"
      - "scripts/v9_pro_builder.py"
      - "templates/v9-pro-react-template.html"
      - "tests/test_react_template_static.py"
      - "tests/test_builder_option_tables.py"
      - "tests/test_p0_workflow_isolation.py"
      - ".github/workflows/daily-premarket-v9-pro.yml"
      - "tests/test_fetch_data_margin_ratio.py"
      - ".github/workflows/test-data-report-margin-ratio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-report-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v4
        with:
          ref: phase2-p0-data-quality
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run 17F offline self-tests
        run: python scripts/v9_pro_builder.py --self-test
      - name: Install Acorn JavaScript parser
        run: npm install --prefix /tmp/v9-js-parser acorn
      - name: Run React template hardcoded-data and syntax tests
        env:
          NODE_PATH: /tmp/v9-js-parser/node_modules
        run: python -m unittest discover -s tests -p "test_react_template_static.py" -v
      - name: Verify DATA_REPORT option tables reach Builder parser
        run: python -m unittest discover -s tests -p "test_builder_option_tables.py" -v
      - name: Verify P0 GitHub Actions branch isolation
        run: python -m unittest discover -s tests -p "test_p0_workflow_isolation.py" -v
      - name: Run Blave-first margin ratio policy unit tests
        run: |
          python -m unittest discover -s tests -p "test_blave_maint_ratio.py" -v
          python -m unittest discover -s tests -p "test_spot_margin_ratio.py" -v
          python -m unittest discover -s tests -p "test_fetch_data_margin_ratio.py" -v
      - name: Build DATA_REPORT for 2026-10-30 T0
        env:
          MANUAL_LISTED_MARGIN_RATIO: ${{ vars.MANUAL_LISTED_MARGIN_RATIO }}
          MANUAL_LISTED_MARGIN_RATIO_DATE: ${{ vars.MANUAL_LISTED_MARGIN_RATIO_DATE }}
        run: python src/fetch_data.py --date 2026-10-31 --t0 2026-10-30
      - name: Verify current T0 ratio is not stale carry-forward
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t0 = "2026-10-30"
          path = Path("data_reports/DATA_REPORT_20261030.md")
          if not path.exists():
              raise SystemExit("DATA_REPORT_NOT_CREATED")
          text = path.read_text(encoding="utf-8")
          rows = [line for line in text.splitlines() if re.search(r"\|\s*融資維持率\s*\|", line)]
          if not rows:
              raise SystemExit("MARGIN_RATIO_ROW_MISSING")
          row = rows[-1]
          print("MARGIN_RATIO_ROW:", row)
          if "前值遞補" in row or "TWSE 上市自建估算" in row:
              raise SystemExit("RETIRED_MARGIN_RATIO_SOURCE_OR_STALE_CARRY_FORWARD_FOUND")
          if "Blave" in row or "人工輸入" in row:
              if f"資料日期：{t0}" not in row:
                  raise SystemExit("MARGIN_RATIO_SOURCE_DATE_MISMATCH")
              print("MARGIN_RATIO_SOURCE=VALID_T0")
          elif "unavailable" in row:
              print("MARGIN_RATIO_SOURCE=UNAVAILABLE_NON_BLOCKING")
          else:
              raise SystemExit("MARGIN_RATIO_SOURCE_NOT_IDENTIFIED")
          for label in ("融資餘額", "融資增減", "融券餘額", "融券增減"):
              if not any(re.search(rf"\|\s*{label}\s*\|", line) for line in text.splitlines()):
                  raise SystemExit(f"EXISTING_MARGIN_INDICATOR_MISSING: {label}")
          print("DATA_REPORT_MARGIN_RATIO_INTEGRATION=PASS")
          PY
      - name: Build V9 Pro JSON from generated T0 DATA_REPORT
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/v9_pro_builder.py --data_report "data_reports/DATA_REPORT_20261030.md" --out "artifacts/data-20261030.json" --date "20261030"
          python -m json.tool "artifacts/data-20261030.json" > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/data-20261030.json").read_text(encoding="utf-8"))
          assert data["meta"]["version"] == "v9-pro-17F"
          assert data["meta"]["date"] == "2026-10-30"
          margin = data["margin"]
          assert margin["ratio"] is not None, "Builder ratio missing"
          assert margin["ratio_status"] == "estimated_t0", margin
          assert margin["ratio_source_date"] == "2026-10-30", margin
          assert margin["ratio_is_t0"] is True, margin
          assert margin["ratio_source_name"] in ("blave", "manual_input"), margin
          options = data["options"]
          for key in ("instOptForce", "top10Call", "top10Put"):
              assert isinstance(options[key], list) and len(options[key]) >= 3, (key, options[key])
          print("BUILDER_JSON_T0_PROVENANCE=PASS", margin["ratio"], margin["ratio_source_name"], margin["ratio_source_date"])
          print("BUILDER_OPTION_TABLES=PASS", {key: len(options[key]) for key in ("instOptForce", "top10Call", "top10Put")})
          PY
      - name: Generate React Dashboard HTML artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data_path = Path("artifacts/data-20261030.json")
          template_path = Path("templates/v9-pro-react-template.html")
          data = json.loads(data_path.read_text(encoding="utf-8"))
          template = template_path.read_text(encoding="utf-8")
          if "var vf=window.DASHBOARD_DATA;" not in template:
              raise SystemExit("React template fallback detected")
          payload = json.dumps(data, ensure_ascii=False, separators=(",", ":")).replace("</", "<\\/")
          injection = f"<script>window.DASHBOARD_DATA={payload};</script>\\n"
          if "</head>" not in template:
              raise SystemExit("React template closing head missing")
          html = template.replace("</head>", injection + "</head>", 1)
          out = Path("artifacts/v9-pro-20261030.html")
          out.write_text(html, encoding="utf-8")
          if "window.DASHBOARD_DATA=" not in html:
              raise SystemExit("React data injection verification failed")
          print("REACT_HTML_ARTIFACT=PASS", out.stat().st_size)
          PY
      - name: Upload DATA_REPORT, JSON and HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: P0-V9-Pipeline-20261030
          path: |
            data_reports/DATA_REPORT_20261030.md
            artifacts/data-20261030.json
            artifacts/v9-pro-20261030.html
          if-no-files-found: error
