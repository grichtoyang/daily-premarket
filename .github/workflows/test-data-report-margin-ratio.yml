name: P0 DATA_REPORT Margin Ratio Integration

on:
  push:
    branches:
      - phase2-p0-data-quality
    paths:
      - "src/sources/blave_maint_ratio.py"
      - "src/sources/spot.py"
      - "src/fetch_data.py"
      - "scripts/v9_pro_builder.py"
      - "templates/v9-pro-react-template.html"
      - "tests/test_react_template_static.py"
      - "tests/test_builder_option_tables.py"
      - "tests/test_fetch_data_margin_ratio.py"
      - ".github/workflows/test-data-report-margin-ratio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-report-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v4
        with:
          ref: phase2-p0-data-quality
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run 17F offline self-tests
        run: python scripts/v9_pro_builder.py --self-test
      - name: Run React template hardcoded-data and syntax tests
        run: python -m unittest discover -s tests -p "test_react_template_static.py" -v
      - name: Verify DATA_REPORT option tables reach Builder parser
        run: python -m unittest discover -s tests -p "test_builder_option_tables.py" -v
      - name: Run Blave-first margin ratio policy unit tests
        run: |
          python -m unittest discover -s tests -p "test_blave_maint_ratio.py" -v
          python -m unittest discover -s tests -p "test_spot_margin_ratio.py" -v
          python -m unittest discover -s tests -p "test_fetch_data_margin_ratio.py" -v
      - name: Build DATA_REPORT for 2026-10-30 T0
        env:
          MANUAL_LISTED_MARGIN_RATIO: ${{ vars.MANUAL_LISTED_MARGIN_RATIO }}
          MANUAL_LISTED_MARGIN_RATIO_DATE: ${{ vars.MANUAL_LISTED_MARGIN_RATIO_DATE }}
        run: python src/fetch_data.py --date 2026-10-31 --t0 2026-10-30
      - name: Verify current T0 ratio is not stale carry-forward
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t0 = "2026-10-30"
          path = Path("data_reports/DATA_REPORT_20261030.md")
          if not path.exists():
              raise SystemExit("DATA_REPORT_NOT_CREATED")
          text = path.read_text(encoding="utf-8")
          rows = [line for line in text.splitlines() if re.search(r"\|\s*融資維持率\s*\|", line)]
          if not rows:
              raise SystemExit("MARGIN_RATIO_ROW_MISSING")
          row = rows[-1]
          print("MARGIN_RATIO_ROW:", row)
          if "前值遞補" in row or "TWSE 上市自建估算" in row:
              raise SystemExit("RETIRED_MARGIN_RATIO_SOURCE_OR_STALE_CARRY_FORWARD_FOUND")
          if "Blave" in row or "人工輸入" in row:
              if f"資料日期：{t0}" not in row:
                  raise SystemExit("MARGIN_RATIO_SOURCE_DATE_MISMATCH")
              print("MARGIN_RATIO_SOURCE=VALID_T0")
          elif "unavailable" in row:
              print("MARGIN_RATIO_SOURCE=UNAVAILABLE_NON_BLOCKING")
          else:
              raise SystemExit("MARGIN_RATIO_SOURCE_NOT_IDENTIFIED")
          for label in ("融資餘額", "融資增減", "融券餘額", "融券增減"):
              if not any(re.search(rf"\|\s*{label}\s*\|", line) for line in text.splitlines()):
                  raise SystemExit(f"EXISTING_MARGIN_INDICATOR_MISSING: {label}")
          print("DATA_REPORT_MARGIN_RATIO_INTEGRATION=PASS")
          PY
      - name: Upload DATA_REPORT artifact
        uses: actions/upload-artifact@v4
        with:
          name: P0-DATA_REPORT-20261030
          path: data_reports/DATA_REPORT_20261030.md
          if-no-files-found: error
