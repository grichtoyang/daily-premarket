name: DL-07 Offline Unit and Integration Validation

on:
  push:
    branches:
      - phase2-p0-ui-fixes
    paths:
      - '.github/workflows/dl07-offline-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dl07-offline-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js for JavaScript contract tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify workflow isolation, branch guards and deployment boundaries
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          dl07_path = Path(".github/workflows/dl07-offline-validation.yml")
          dl06_path = Path(".github/workflows/dl06-retry-tests.yml")
          dashboard_path = Path(".github/workflows/daily-premarket-v9-pro.yml")
          data_path = Path(".github/workflows/daily_data.yml")
          legacy_p0_integration = Path(".github/workflows/test-data-report-margin-ratio.yml")

          dl07 = dl07_path.read_text(encoding="utf-8")
          dl06 = dl06_path.read_text(encoding="utf-8")
          dashboard = dashboard_path.read_text(encoding="utf-8")
          daily_data = data_path.read_text(encoding="utf-8")

          # The dedicated validation workflows must be read-only and non-publishing.
          for name, workflow in (("DL-07", dl07), ("DL-06", dl06)):
              assert "permissions:\n  contents: read" in workflow, f"{name} must have contents:read"
              assert not re.search(r"(?m)^ *contents: *write *$", workflow), f"{name} has write permission"
              assert not re.search(r"(?m)^ *uses: *actions/deploy-pages@", workflow), f"{name} deploys Pages"
              assert not re.search(r"(?m)^ *git +(add|commit|push)( |$)", workflow), f"{name} mutates git"
          assert "TemporaryDirectory" in dl06 and "fake_python" in dl06
          assert "workflow_dispatch:" in dl07
          assert "ref: ${{ github.sha }}" in dl07

          # Current Dashboard workflow: checkout is pinned to triggering SHA;
          # generated commits are explicitly limited to the two P0 working branches.
          assert "ref: ${{ github.sha }}" in dashboard
          assert "if: github.ref == 'refs/heads/phase2-p0-data-quality' || github.ref == 'refs/heads/phase2-p0-ui-fixes'" in dashboard
          assert 'if [ "${GITHUB_REF_NAME}" != "phase2-p0-data-quality" ] && [ "${GITHUB_REF_NAME}" != "phase2-p0-ui-fixes" ]; then' in dashboard
          assert 'git push origin "HEAD:${GITHUB_REF_NAME}"' in dashboard
          assert "git add dashboards/" in dashboard
          assert "git add data_reports" not in dashboard

          # The Pages deploy job is limited to the repository default branch or P0 base;
          # phase2-p0-ui-fixes is deliberately not in that deploy condition.
          deploy_gate = "if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/phase2-p0-data-quality'"
          assert deploy_gate in dashboard
          assert "uses: actions/deploy-pages@v4" in dashboard
          assert "phase2-p0-ui-fixes" not in deploy_gate

          # The old P0 integration workflow referenced by the legacy unit test is absent.
          # The production DATA workflow is write-capable, so this validation must not invoke it.
          assert not legacy_p0_integration.exists()
          assert "permissions:\n  contents: write" in daily_data
          assert "git push" in daily_data
          assert "python src/fetch_data.py" not in dl07
          print("PASS: DL-06/DL-07 are read-only; Dashboard branch/commit/deploy guards match current workflow")
          print("PASS: production daily_data workflow is identified as write-capable and excluded")
          print("NOT TESTED: legacy P0 integration workflow (referenced file is absent)")
          PY

      - name: Run offline unit tests (exclude live API probe and stale workflow-reference test)
        run: |
          python3 <<'PY'
          import unittest

          excluded_modules = {"test_spot_borrowed_live", "test_p0_workflow_isolation"}
          excluded_ids = {
              "test_dashboard_unit_contract.DashboardUnitContractTests.test_data_report_template_matches_builder_units",
              "test_dashboard_unit_contract.DashboardUnitContractTests.test_option_ratio_changes_use_percentage_points",
              "test_dashboard_unit_contract.DashboardUnitContractTests.test_treasury_yield_curve_includes_20_year",
          }
          loader = unittest.TestLoader()
          discovered = loader.discover("tests", pattern="test_*.py")
          selected = []
          skipped = {}

          def collect(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      collect(item)
                      continue
                  test_id = item.id()
                  module = test_id.split(".", 1)[0]
                  if module in excluded_modules or test_id in excluded_ids:
                      skipped[test_id] = "external live probe" if module == "test_spot_borrowed_live" else "stale workflow/source-text assertion"
                  else:
                      selected.append(item)

          collect(discovered)
          print("Excluded cases and reasons:", skipped)
          print("Selected test cases:", len(selected))
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          if not result.wasSuccessful():
              raise SystemExit(1)
          print(f"PASS: {result.testsRun} offline unit tests")
          PY

      - name: Verify updated DATA_REPORT, ratio and Treasury unit contracts
        run: |
          python3 <<'PY'
          from pathlib import Path

          builder = Path("scripts/v9_pro_builder.py").read_text(encoding="utf-8")
          fetch_data = Path("src/fetch_data.py").read_text(encoding="utf-8")
          treasury = Path("src/sources/treasury.py").read_text(encoding="utf-8")

          assert 'fut_day_o=table_value(day_heading, "開盤價", "點", True)' in builder
          assert 'basis=optional_get(r"台指期與加權指數價差' in builder
          assert '"百分點（pp）",' in fetch_data
          assert '_source_if_available(_vol_ratio_change, _pch_src)' in fetch_data
          assert '"20Y": ("xml", "BC_20YEAR", None)' in treasury
          assert 'fallback = _xml_yield(xml_field)' in treasury
          assert '("20Y", "20", "20 Yr")' in fetch_data
          assert 'yields[key]["yield"]' in fetch_data
          print("PASS: current required/optional parsing, percentage-point units and 20Y fallback contracts")
          PY

      - name: Run V9 Pro 17F offline self-tests
        run: python scripts/v9_pro_builder.py --self-test

      - name: Rebuild historical DATA_REPORT fixtures in an isolated workspace
        env:
          WORKSPACE: ${{ runner.temp }}/dl07-workspace
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          git archive "$GITHUB_SHA" | tar -x -C "$WORKSPACE"
          cd "$WORKSPACE"
          mkdir -p dashboards
          python scripts/v9_pro_builder.py --data_report data_reports/DATA_REPORT_20261030.md --out dashboards/data-20261030.json --date 20261030
          python scripts/v9_pro_builder.py --data_report data_reports/DATA_REPORT_20261102.md --out dashboards/data-20261102.json --date 20261102
          python -m json.tool dashboards/data-20261030.json > /dev/null
          python -m json.tool dashboards/data-20261102.json > /dev/null

      - name: Inject historical JSON into temporary HTML and validate JavaScript
        env:
          WORKSPACE: ${{ runner.temp }}/dl07-workspace
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("dashboards")
          template = Path("templates/v9-pro-react-template.html").read_text(encoding="utf-8")
          if "var vf=window.DASHBOARD_DATA;" not in template:
              raise SystemExit("React template must consume injected data only")
          if "</head>" not in template:
              raise SystemExit("React template closing head is missing")
          required_tabs = ["總覽", "現貨", "重要市場", "期貨", "選擇權", "綜合分析"]
          missing = [tab for tab in required_tabs if tab not in template]
          if missing:
              raise SystemExit(f"Required Dashboard tabs missing: {missing}")

          for date in ("20261030", "20261102"):
              data_path = output / f"data-{date}.json"
              data = json.loads(data_path.read_text(encoding="utf-8"))
              expected_date = f"{date[:4]}-{date[4:6]}-{date[6:]}"
              if data.get("meta", {}).get("date") != expected_date:
                  raise SystemExit(f"T0 mismatch for {date}: {data.get('meta', {}).get('date')}")
              if data.get("meta", {}).get("version") != "v9-pro-17F":
                  raise SystemExit(f"Unexpected Builder version for {date}")
              payload = json.dumps(data, ensure_ascii=False, separators=(",", ":")).replace("</", "<\\/")
              html = template.replace("</head>", f"<script>window.DASHBOARD_DATA={payload};</script>\n</head>", 1)
              html_path = output / f"v9-pro-{date}.html"
              html_path.write_text(html, encoding="utf-8")
              if "window.DASHBOARD_DATA=" not in html:
                  raise SystemExit(f"Injection failed for {date}")
              print(f"PASS: historical JSON and HTML fixture {date} ({html_path.stat().st_size} bytes)")
          PY
          python tests/validate_react_html_js.py dashboards/v9-pro-20261030.html
          python tests/validate_react_html_js.py dashboards/v9-pro-20261102.html

      - name: Confirm repository fixtures were not modified
        run: |
          set -euo pipefail
          git diff --exit-code -- data_reports/ dashboards/
          echo "PASS: historical DATA_REPORT fixtures and repository Dashboard outputs remain unchanged"
