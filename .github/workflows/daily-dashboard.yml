name: Daily V7 Pro Dashboard

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'DATA_REPORT 日期 YYYYMMDD (留空用今天)'
        required: false
        default: ''

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure dashboard dir
        run: mkdir -p dashboard && touch dashboard/.gitkeep

      - name: Generate V7 Pro Dashboard
        run: |
          if [ -z "${{ inputs.date }}" ]; then
            python scripts/generate_daily.py
          else
            python scripts/generate_daily.py --date ${{ inputs.date }}
          fi

      - name: Commit & Push Dashboard
        run: |
          git config user.name "v7-pro-bot"
          git config user.email "bot@grichtoyang.github.io"
          git add dashboard/
          git diff --staged --quiet || git commit -m "chore: auto dashboard $(date +%Y%m%d) - V7 Pro e6cf29a748b0"
          git push
