name: Daily V7 Pro Dashboard

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'DATA_REPORT 日期 YYYYMMDD (留空自動今天)'
        required: false

# 關鍵：給 Actions 寫入權限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure dashboard dir
        run: |
          mkdir -p dashboard dashboards data_reports
          ls -la

      - name: Generate V7 Pro Dashboard
        run: |
          if [ -z "${{ inputs.date }}" ]; then
            echo "No date input, using today"
            python scripts/generate_daily.py
          else
            echo "Using date ${{ inputs.date }}"
            python scripts/generate_daily.py --date ${{ inputs.date }}
          fi

      - name: List outputs
        run: |
          ls -lh dashboard/ || true
          ls -lh dashboards/ || true
          echo "--- spot check ---"
          grep -o "he={date" dashboard/taifex-*.html | head -n 1 || true

      - name: Commit & Push Dashboard
        run: |
          git config user.name "v7-pro-bot"
          git config user.email "bot@grichtoyang.github.io"
          git pull --rebase || true
          git add dashboard/ dashboards/ data_reports/ || true
          git diff --staged --quiet || git commit -m "chore: auto dashboard $(date +%Y%m%d) - V7 Pro"
          git push
