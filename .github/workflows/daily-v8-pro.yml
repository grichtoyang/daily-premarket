name: Daily V8 Pro Dashboard - 40 Cards Full Dynamic

on:
  schedule:
    # 避開 00:30 尖峰，用 07/17/27 分散，GitHub官方建議避開整點
    - cron: '27 0 * * 1-5'  # 08:27 Taipei - 主
    - cron: '37 0 * * 1-5'  # 08:37 Taipei - 備援1 (若27分塞車)
    - cron: '47 0 * * 1-5'  # 08:47 Taipei - 備援2
  workflow_dispatch:
    inputs:
      date:
        description: 'DATA_REPORT 日期 YYYYMMDD (留空自動今天)'
        required: false
  repository_dispatch:
    types: [v8-pro-trigger]  # 外部 Cloudflare Worker 觸發用

# 防止同時跑3個，用 concurrency + cancel-in-progress
concurrency:
  group: v8-pro-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 若已產過當日檔案，跳過 (避免 27/37/47 重複跑3次)
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check if today already built (avoid duplicate)
        id: check
        run: |
          DATE=$(TZ='Asia/Taipei' date +%Y%m%d)
          EVENT="${{ github.event_name }}"
          echo "Event: $EVENT Date: $DATE"
          # 手動觸發 workflow_dispatch / repository_dispatch 永遠強制重跑 (修復新builder測試)
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "repository_dispatch" ]; then
            echo "Manual trigger ($EVENT), force rebuild (no skip)"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -f "dashboards/taifex-${DATE}.html" ]; then
            echo "Dashboard for $DATE already exists, checking age..."
            # 只有 schedule 才跳過 2h 內的重複，避免 27/37/47 三次都跑
            FILE_AGE=$(find dashboards/taifex-${DATE}.html -mmin -120 2>/dev/null | wc -l)
            if [ "$FILE_AGE" -eq 1 ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Dashboard already built within 2h, skipping (schedule duplicate protection)"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure dirs & Find Builder (3層備援)
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p dashboards templates scripts
          echo "=== Builder search ==="
          # 3層備援找 Builder： v8_pro_builder.py -> scripts/v8_pro_builder.py -> dashboards/v8_pro_builder.py
          if [ -f "v8_pro_builder.py" ]; then
            echo "BUILDER_PATH=v8_pro_builder.py" >> $GITHUB_ENV
          elif [ -f "scripts/v8_pro_builder.py" ]; then
            echo "BUILDER_PATH=scripts/v8_pro_builder.py" >> $GITHUB_ENV
          elif [ -f "dashboards/v8_pro_builder.py" ]; then
            echo "BUILDER_PATH=dashboards/v8_pro_builder.py" >> $GITHUB_ENV
          else
            echo "ERROR: Builder not found!"
            find . -name "*builder*.py" | head -20
            exit 1
          fi
          echo "Using $BUILDER_PATH size $(wc -c < $BUILDER_PATH)"
          
          if [ ! -f "templates/v8-pro-golden-master.html" ]; then
            echo "Golden master missing, trying backup..."
            find . -name "v8-pro-golden-master.html" | head -5
            # 用最新的一個
            LATEST=$(find . -name "v8-pro-golden-master.html" -type f -exec ls -t {} + | head -1)
            if [ -n "$LATEST" ]; then
              cp "$LATEST" templates/v8-pro-golden-master.html
              echo "Restored golden from $LATEST"
            else
              exit 1
            fi
          fi

      - name: Find DATA_REPORT (data source for real values - by filename date)
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ -z "${{ inputs.date }}" ]; then
            DATE=$(TZ='Asia/Taipei' date +%Y%m%d)
          else
            DATE="${{ inputs.date }}"
          fi
          echo "DATE=$DATE" >> $GITHUB_ENV
          # 規則：1. 當日精準 2. 按檔名 YYYYMMDD 排序最新 3. mtime 最新備援 (含 data_reports/ - 實際路徑)
          REPORT_CANDIDATES="DATA_REPORT_${DATE}.md dashboards/DATA_REPORT_${DATE}.md data/DATA_REPORT_${DATE}.md reports/DATA_REPORT_${DATE}.md data_reports/DATA_REPORT_${DATE}.md DATA_REPORT_20261027.md"
          FOUND=""
          for f in $REPORT_CANDIDATES; do
            if [ -f "$f" ]; then
              FOUND=$f
              echo "Matched exact date: $f"
              break
            fi
          done
          # 當日找不到 → 按檔名日期排序取最新 (最穩，不靠 mtime)
          if [ -z "$FOUND" ]; then
            # 收集所有候選，按檔名降序 (20261027 > 20261026) 含 data_reports/
            ALL_REPORTS=$(ls DATA_REPORT_*.md dashboards/DATA_REPORT_*.md data/DATA_REPORT_*.md reports/DATA_REPORT_*.md data_reports/DATA_REPORT_*.md 2>/dev/null | sort -r)
            if [ -n "$ALL_REPORTS" ]; then
              FOUND=$(echo "$ALL_REPORTS" | head -1)
              echo "No exact date, using latest by filename: $FOUND"
              echo "All reports sorted:"
              echo "$ALL_REPORTS" | head -10
            fi
          fi
          # 還是沒有 → mtime 最新備援
          if [ -z "$FOUND" ]; then
            FOUND=$(ls -t DATA_REPORT_*.md dashboards/DATA_REPORT_*.md data_reports/DATA_REPORT_*.md 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              echo "Fallback to latest by mtime: $FOUND"
            fi
          fi
          if [ -n "$FOUND" ]; then
            echo "Found DATA_REPORT: $FOUND size $(wc -c < $FOUND)"
            echo "DATA_REPORT_PATH=$FOUND" >> $GITHUB_ENV
            # 印關鍵數據供驗證
            grep -E "加權指數|外資|投信|台指期近月|Put／Call Ratio" "$FOUND" | head -20
            # 印檔名日期供核對
            echo "Report filename date: $(basename $FOUND | grep -o '[0-9]\{8\}')"
          else
            echo "ERROR: No DATA_REPORT found! Builder now in NO-FALLBACK mode, must have DATA_REPORT"
            echo "Searched: DATA_REPORT_*.md dashboards/DATA_REPORT_*.md data/DATA_REPORT_*.md reports/DATA_REPORT_*.md data_reports/DATA_REPORT_*.md"
            ls -R | grep -i DATA_REPORT || echo "No DATA_REPORT files at all"
            echo "Failing build - DATA_REPORT is required (no golden fallback)"
            exit 1
          fi

      - name: Generate V8 Pro Dashboard (40 cards full dynamic - with DATA_REPORT)
        if: steps.check.outputs.skip == 'false'
        run: |
          DATE=${{ env.DATE }}
          BUILDER="${{ env.BUILDER_PATH }}"
          GOLDEN="templates/v8-pro-golden-master.html"
          REPORT="${{ env.DATA_REPORT_PATH }}"
          
          echo "Building with $BUILDER --date $DATE --golden $GOLDEN --data_report $REPORT"
          echo "Builder size: $(wc -c < $BUILDER) hash $(sha256sum $BUILDER | cut -c1-12)"
          echo "Golden size: $(wc -c < $GOLDEN) hash $(sha256sum $GOLDEN | cut -c1-12)"
          if [ -n "$REPORT" ]; then
            echo "DATA_REPORT $REPORT size $(wc -c < $REPORT) hash $(sha256sum $REPORT | cut -c1-12)"
          fi
          
          # 3次重試，無fallback模式 - 必須有 DATA_REPORT
          for i in 1 2 3; do
            echo "=== Attempt $i (NO-FALLBACK mode - DATA_REPORT required) ==="
            if [ -z "$REPORT" ]; then
              echo "ERROR: DATA_REPORT_PATH is empty in no-fallback mode"
              exit 1
            fi
            if python $BUILDER --date $DATE --golden $GOLDEN --data_report $REPORT; then
              echo "Build success on attempt $i with DATA_REPORT (no fallback)"
              break
            fi
            echo "Build failed on attempt $i, retry in 30s..."
            sleep 30
            if [ $i -eq 3 ]; then
              echo "All 3 attempts failed! Builder in no-fallback mode requires DATA_REPORT"
              exit 1
            fi
          done
          
          # 驗證是否真的吃到 DATA_REPORT (無fallback - 嚴格檢查)
          FILE="dashboards/taifex-${DATE}.html"
          echo "--- Verify he matches DATA_REPORT (NO-FALLBACK) ---"
          grep -o "close:[0-9.]*" "$FILE" | head -1
          grep -o "foreign:-*[0-9.]*" "$FILE" | head -3
          echo "--- Verify KPI 8宮格 no old data ---"
          if grep -q "46,041\|46,942.*47,332\|46,272 -741\|-994.7億\|-87,297\|PCR 0.57\|49K2444\|上市247 上櫃146\|加權 -1.81%" "$FILE"; then
            echo "ERROR: Old golden data still in dashboard! KPI not fully rebuilt"
            grep -n "46,041\|46,942\|46,272\|-994.7億\|-87,297\|PCR 0.57" "$FILE" | head -20
            exit 1
          else
            echo "PASS: No old golden data found - 100% DATA_REPORT driven"
          fi
          echo "--- Verify KPI new data ---"
          grep -o "46,096\|46,211 / 46,585 / 45,676\|+31.7億\|PCR 0.46" "$FILE" | head -10

      - name: List outputs & Verify 40 cards
        if: steps.check.outputs.skip == 'false'
        run: |
          ls -lh dashboards/ | tail -20
          echo "--- Verify V8 Pro 40 cards ---"
          FILE=$(ls -t dashboards/taifex-*.html | head -1)
          echo "Latest: $FILE size $(wc -c < $FILE)"
          grep -o "Bias 盤前偏向" "$FILE" | wc -l
          echo "Cards count: $(grep -o 'title:"' "$FILE" | wc -l) (should be 41)"
          echo "Dynamic check: $(grep -c "15因子共振\|Regime" "$FILE") dynamic phrases"

      - name: Commit & Push Dashboard + DB
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "v8-pro-bot"
          git config user.email "bot@grichtoyang.github.io"
          git pull --rebase || true
          git add dashboards/ templates/v8-pro-golden-master.html || true
          # 若有 SQLite DB 也提交 (真回測用)
          git add dashboards/*.db || true
          git diff --staged --quiet || git commit -m "chore: auto dashboard $(date +%Y%m%d) - V8 Pro 40 cards 15-factor + VIX dynamic + 20 templates"
          git push

  # 備案通知：若塞車超過 09:00 還沒產，發 issue 提醒
  notify-delay:
    if: always()
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Check if dashboard exists
        run: |
          DATE=$(TZ='Asia/Taipei' date +%Y%m%d)
          if [ ! -f "dashboards/taifex-${DATE}.html" ]; then
            echo "Dashboard missing for $DATE after all retries! Creating issue..."
            gh issue create --title "V8 Pro Dashboard missing $DATE - GitHub Actions congested" --body "Schedule 27/37/47 all failed, need manual trigger via Cloudflare Worker backup" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
