name: Daily V8 Pro Dashboard

on:
  schedule:
    - cron: '30 0 * * 1-5'  # 08:30 Taipei
  workflow_dispatch:
    inputs:
      date:
        description: 'DATA_REPORT 日期 YYYYMMDD (留空自動今天)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure dashboards dir
        run: |
          mkdir -p dashboards templates
          ls -la
          ls -lh scripts/v8_pro_builder.py || echo "builder not found"

      - name: Generate V8 Pro Dashboard
        run: |
          if [ -z "${{ inputs.date }}" ]; then
            DATE=$(TZ='Asia/Taipei' date +%Y%m%d)
            echo "No date input, using today: $DATE"
          else
            DATE="${{ inputs.date }}"
            echo "Using date: $DATE"
          fi
          
          BUILDER="scripts/v8_pro_builder.py"
          GOLDEN="templates/v8-pro-golden-master.html"
          
          if [ ! -f "$BUILDER" ]; then
            echo "ERROR: $BUILDER not found!"
            find . -name "v8_pro_builder.py" -o -name "*builder*.py" | head -20
            exit 1
          fi
          
          if [ ! -f "$GOLDEN" ]; then
            echo "ERROR: $GOLDEN not found!"
            ls -lh templates/
            exit 1
          fi
          
          echo "Building with $BUILDER --date $DATE --golden $GOLDEN"
          python $BUILDER --date $DATE --golden $GOLDEN

      - name: List outputs
        run: |
          ls -lh dashboards/ | tail -20
          echo "--- spot check V8 PRO ---"
          grep -o "TAIFEX PREMARKET V8 PRO" dashboards/taifex-*.html | tail -1 || echo "V8 PRO tag check failed"

      - name: Commit & Push Dashboard
        run: |
          git config user.name "v8-pro-bot"
          git config user.email "bot@grichtoyang.github.io"
          git pull --rebase || true
          git add dashboards/ templates/v8-pro-golden-master.html || true
          git diff --staged --quiet || git commit -m "chore: auto dashboard $(date +%Y%m%d) - V8 Pro only dashboards/"
          git push
