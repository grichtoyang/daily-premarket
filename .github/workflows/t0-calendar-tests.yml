name: T0 Calendar Regression Tests

on:
  push:
    branches:
      - phase2-p0-ui-fixes
    paths:
      - 'src/t0.py'
      - 'tests/test_t0_calendar_fail_closed.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t0-calendar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required dependency
        run: python -m pip install --upgrade pip requests

      - name: Run only the six T0 calendar regression tests
        run: python -m unittest discover -s tests -p "test_t0_calendar_fail_closed.py" -v
