name: Daily Premarket V9 Pro
on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check template exists
        run: |
          ls -lh templates/
          if [ ! -f templates/v9-pro-react-template.html ]; then
            echo "ERROR: templates/v9-pro-react-template.html not found!"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pytz

      - name: Build data.json from DATA_REPORT
        run: |
          REPORT=$(ls -1 data_reports/DATA_REPORT_*.md 2>/dev/null | sort -r | head -n1)
          if [ -z "$REPORT" ]; then echo "No DATA_REPORT"; exit 1; fi
          DATE=$(basename "$REPORT" | sed 's/DATA_REPORT_//;s/.md//')
          echo "DATE=$DATE" >> $GITHUB_ENV
          python scripts/v9_pro_builder.py --data_report "$REPORT" --out dashboards/data-${DATE}.json --date ${DATE}
          cp dashboards/data-${DATE}.json dashboards/data-latest.json

      - name: Inject HTML
        run: |
          python3 << 'PY'
          from pathlib import Path
          tmpl = Path('templates/v9-pro-react-template.html').read_text(encoding='utf-8')
          import glob
          data_file = sorted(Path('dashboards').glob('data-*.json'))[-1]
          data = data_file.read_text(encoding='utf-8').replace('</script>', '<\/script>')
          inject = f'<script>window.DASHBOARD_DATA={data}</script>\n'
          out = tmpl.replace('</head>', inject + '</head>') if '</head>' in tmpl else inject + tmpl
          date = data_file.stem.replace('data-','')
          Path(f'dashboards/v9-pro-{date}.html').write_text(out, encoding='utf-8')
          Path('dashboards/v9-pro-latest.html').write_text(out, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dashboards/
          git commit -m "v9 pro ${{ env.DATE }} real data" || echo "no changes"
          git push || echo "push failed"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboards
