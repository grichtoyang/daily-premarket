name: Daily Premarket V9 Pro
on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check template
        run: |
          ls -lh templates/
          if [ ! -f templates/v9-pro-react-template.html ]; then echo "ERROR missing template"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz
      - name: Build data.json
        run: |
          REPORT=$(ls -1 data_reports/DATA_REPORT_*.md | sort -r | head -n1)
          DATE=$(basename "$REPORT" | sed 's/DATA_REPORT_//;s/.md//')
          echo "DATE=$DATE" >> $GITHUB_ENV
          python scripts/v9_pro_builder.py --data_report "$REPORT" --out dashboards/data-${DATE}.json --date ${DATE}
          cp dashboards/data-${DATE}.json dashboards/data-latest.json
      - name: Inject self-contained real data
        run: |
          python3 << 'PY'
          from pathlib import Path
          def find_matching_brace(s, start_idx):
              depth=0
              for i in range(start_idx, len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0: return i
              return -1
          tmpl_path = Path('templates/v9-pro-react-template.html')
          tmpl = tmpl_path.read_text(encoding='utf-8')
          data_file = sorted(Path('dashboards').glob('data-*.json'))[-1]
          real_data = data_file.read_text(encoding='utf-8')
          safe_data = real_data.replace("</script>", "<\/script>")
          out = tmpl
          if 'var df=null' in tmpl:
              out = tmpl.replace('var df=null', 'var df=' + real_data)
          elif 'var df={' in tmpl:
              idx = tmpl.find('var df={')
              brace_start = tmpl.find('{', idx)
              brace_end = find_matching_brace(tmpl, brace_start)
              if brace_end != -1:
                  out = tmpl[:brace_start] + real_data + tmpl[brace_end+1:]
          else:
              inject = '<script>window.DASHBOARD_DATA=' + safe_data + '</script>
'
              out = tmpl.replace('</head>', inject + '</head>') if '</head>' in tmpl else inject + tmpl
          date = data_file.stem.replace('data-','')
          Path(f'dashboards/v9-pro-{date}.html').write_text(out, encoding='utf-8')
          Path('dashboards/v9-pro-latest.html').write_text(out, encoding='utf-8')
          print(f"Wrote size {Path(f'dashboards/v9-pro-{date}.html').stat().st_size}")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dashboards/
          git commit -m "v9 pro ${{ env.DATE }} real data" || echo "no changes"
          git push
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboards
