name: Daily V9 Pro Premarket

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pytz
      - name: Build data.json
        run: |
          REPORT=$(ls -1 data_reports/DATA_REPORT_*.md | sort -r | head -n1)
          DATE=$(basename "$REPORT" | sed 's/DATA_REPORT_//;s/.md//')
          echo "DATE=$DATE" >> $GITHUB_ENV
          python scripts/v9_pro_builder.py --data_report "$REPORT" --out dashboards/data-${DATE}.json --date ${DATE}
          cp dashboards/data-${DATE}.json dashboards/data-latest.json
      - name: Generate self-contained dashboard
        run: python scripts/inject_dashboard.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboards/
          git commit -m "v9 pro ${{ env.DATE }} real data" || echo "no changes"
          git push
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboards
