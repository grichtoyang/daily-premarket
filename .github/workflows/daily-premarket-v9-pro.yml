name: Daily Premarket V9 Pro

on:
  push:
    branches:
      - master
      - phase2-p0-data-quality
      - phase2-p0-ui-fixes
    paths:
      - '.github/workflows/daily-premarket-v9-pro.yml'
      - 'scripts/v9_pro_builder.py'
      - 'templates/v9-pro-react-template.html'
      - 'data_reports/DATA_REPORT_*.md'
      - 'src/sources/**'
      - 'tests/**'
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'T0 date in YYYYMMDD; blank uses the newest DATA_REPORT'
        required: false
        type: string

permissions:
  contents: write

# Serialize dashboard builds per branch to prevent concurrent generated-history pushes.
concurrency:
  group: daily-premarket-v9-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Checkout master dashboard source for Pages root only
        uses: actions/checkout@v4
        with:
          ref: master
          path: master-site

      - name: Verify V9 Pro build template comes from triggering commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_SHA" ]; then
            echo "Build checkout does not match triggering commit"
            echo "expected=$EXPECTED_SHA actual=$actual_head"
            exit 1
          fi
          template_path="templates/v9-pro-react-template.html"
          test -s "$template_path"
          tracked_template_sha="$(git rev-parse "${EXPECTED_SHA}:$template_path")"
          worktree_template_sha="$(git hash-object "$template_path")"
          if [ "$tracked_template_sha" != "$worktree_template_sha" ]; then
            echo "V9 Pro template differs from the triggering commit"
            exit 1
          fi
          master_head="$(git -C master-site rev-parse HEAD)"
          master_template_sha="$(git -C master-site rev-parse "HEAD:$template_path")"
          echo "V9_PRO_BUILD_COMMIT=$actual_head"
          echo "V9_PRO_TEMPLATE_BLOB=$tracked_template_sha"
          echo "MASTER_PAGES_ROOT_COMMIT=$master_head"
          echo "MASTER_TEMPLATE_BLOB=$master_template_sha"
          echo "Verified: V9 Pro build uses the triggering commit template; master-site is reserved for the Pages root."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Resolve DATA_REPORT
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_DATE}" ]; then
            DATE="${REQUESTED_DATE}"
            if ! [[ "${DATE}" =~ ^[0-9]{8}$ ]]; then
              echo "Invalid date; expected YYYYMMDD"
              exit 1
            fi
            REPORT="data_reports/DATA_REPORT_${DATE}.md"
            if [ ! -f "${REPORT}" ]; then
              REPORT="DATA_REPORT_${DATE}.md"
            fi
            if [ ! -f "${REPORT}" ]; then
              echo "Requested DATA_REPORT not found; refusing silent fallback"
              exit 1
            fi
          else
            REPORT="$(find data_reports -maxdepth 1 -type f -name 'DATA_REPORT_*.md' -print 2>/dev/null | sort -r | head -n1 || true)"
            if [ -z "${REPORT}" ]; then
              REPORT="$(find . -maxdepth 1 -type f -name 'DATA_REPORT_*.md' -print | sort -r | head -n1 || true)"
            fi
            if [ -z "${REPORT}" ]; then
              echo "No DATA_REPORT found"
              exit 1
            fi
            DATE="$(basename "${REPORT}" | sed -E 's/^DATA_REPORT_([0-9]{8})\.md$/\1/')"
          fi
          echo "DATE=${DATE}" >> "${GITHUB_ENV}"
          echo "REPORT=${REPORT}" >> "${GITHUB_ENV}"
          echo "Using ${REPORT} for T0 ${DATE}"
          mkdir -p dashboards

      - name: Test listed maintenance ratio source chain and DATA_REPORT merge
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_listed_maint_ratio.py" -v
          python -m unittest discover -s tests -p "test_blave_maint_ratio.py" -v
          python -m unittest discover -s tests -p "test_spot_margin_ratio.py" -v
          python -m unittest discover -s tests -p "test_fetch_data_margin_ratio.py" -v

      - name: Run same-T0 report timestamp regression tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_fetch_data_same_t0_source.py" -v

      - name: Run borrowed securities source contract tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_fetch_data_borrowed_sources.py" -v

      - name: Run 17F offline self-tests
        run: |
          set -euo pipefail
          python scripts/v9_pro_builder.py --self-test

      - name: Run Gamma fallback availability regression tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_taifex_gamma_fallback.py" -v

      - name: Seed dashboard correlation history from dated DATA_REPORTs
        run: |
          set -euo pipefail
          if ! python scripts/v9_pro_builder.py --seed-correlation-history --date "${DATE}"; then
            echo "::warning::Correlation history seed unavailable; dashboard build continues with heatmap marked unavailable."
          fi

      - name: Build dashboard data
        run: |
          set -euo pipefail
          python scripts/v9_pro_builder.py --data_report "${REPORT}" --out "dashboards/data-${DATE}.json" --date "${DATE}"
          python -m json.tool "dashboards/data-${DATE}.json" > /dev/null

      - name: Inject data into React Golden Master
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, pathlib
          date = os.environ["DATE"]
          template_path = pathlib.Path("templates/v9-pro-react-template.html")
          data_path = pathlib.Path(f"dashboards/data-{date}.json")
          template = template_path.read_text(encoding="utf-8")
          if "var vf=window.DASHBOARD_DATA;" not in template:
              raise SystemExit("React template must read injected DASHBOARD_DATA directly; sample fallback is forbidden")
          data_obj = json.loads(data_path.read_text(encoding="utf-8"))
          required_tabs = ["總覽", "現貨", "重要市場", "期貨", "選擇權", "綜合分析"]
          missing = [tab for tab in required_tabs if tab not in template]
          if missing:
              raise SystemExit(f"Golden Master missing tabs: {missing}")
          if data_obj.get("meta", {}).get("version") != "v9-pro-17F":
              raise SystemExit("Unexpected dashboard data version")
          options = data_obj.get("options", {})
          if "extendedFlip" not in options:
              raise SystemExit("Dashboard data is missing options.extendedFlip")
          if options.get("flip") is not None and options.get("extendedFlip") is not None:
              raise SystemExit("Extended Gamma Flip must be suppressed when formal ±10% Flip exists")
          data = json.dumps(data_obj, ensure_ascii=False, separators=(",", ":")).replace("</", "<\\/")
          injection = f"<script>window.DASHBOARD_DATA={data};</script>" + chr(10)
          if "</head>" not in template:
              raise SystemExit("Golden Master has no closing </head>")
          html = template.replace("</head>", injection + "</head>", 1)
          out = pathlib.Path(f"dashboards/v9-pro-{date}.html")
          out.write_text(html, encoding="utf-8")
          if "window.DASHBOARD_DATA=" not in html:
              raise SystemExit("Dashboard data injection verification failed")
          print(f"Generated {out} ({out.stat().st_size} bytes)")
          PY

      - name: Publish latest aliases and Pages entrypoint
        run: |
          set -euo pipefail
          cp "dashboards/data-${DATE}.json" dashboards/data-latest.json
          cp "dashboards/v9-pro-${DATE}.html" dashboards/v9-pro-latest.html
          cp "dashboards/v9-pro-${DATE}.html" dashboards/index.html
          printf '{"date":"%s","data":"data-%s.json","html":"v9-pro-%s.html"}\n' "${DATE}" "${DATE}" "${DATE}" > dashboards/manifest.json
          test -s dashboards/index.html
          ls -lh dashboards/

      - name: Build 20261030 full-day golden fixture and validate HTML JavaScript
        run: |
          set -euo pipefail
          mkdir -p dashboards/test-fixtures
          python scripts/v9_pro_builder.py --data_report data_reports/DATA_REPORT_20261030.md --out dashboards/test-fixtures/data-20261030.json --date 20261030
          python3 <<'PY'
          import json, pathlib
          template = pathlib.Path("templates/v9-pro-react-template.html").read_text(encoding="utf-8")
          data_obj = json.loads(pathlib.Path("dashboards/test-fixtures/data-20261030.json").read_text(encoding="utf-8"))
          if data_obj.get("meta", {}).get("date") != "2026-10-30":
              raise SystemExit("Golden fixture T0 mismatch")
          data = json.dumps(data_obj, ensure_ascii=False, separators=(",", ":")).replace("</", "<\\/")
          html = template.replace("</head>", f"<script>window.DASHBOARD_DATA={data};</script>\\n</head>", 1)
          out = pathlib.Path("dashboards/test-fixtures/v9-pro-20261030-full-day.html")
          out.write_text(html, encoding="utf-8")
          print(f"Golden fixture generated: {out} ({out.stat().st_size} bytes)")
          PY
          python tests/validate_react_html_js.py "dashboards/v9-pro-${DATE}.html"
          python tests/validate_react_html_js.py dashboards/test-fixtures/v9-pro-20261030-full-day.html

      - name: Decide whether to run full browser audit
        id: browser_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 <<'PY'
          import os, subprocess
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True
          ).splitlines())
          trigger_paths = {
              "templates/v9-pro-react-template.html",
              "scripts/v9_pro_builder.py",
              ".github/workflows/daily-premarket-v9-pro.yml",
              "tests/browser_dashboard_audit.mjs",
              "tests/validate_react_html_js.py",
          }
          should_run = os.environ["EVENT_NAME"] == "workflow_dispatch" or bool(changed & trigger_paths)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          print(f"Browser audit gate: {should_run}; changed paths: {sorted(changed)}")
          PY

      - name: Setup Node for conditional browser audit
        if: steps.browser_gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright for conditional browser audit
        if: steps.browser_gate.outputs.run == 'true'
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run six-tab Desktop and Mobile browser audit on freshly built HTML
        if: steps.browser_gate.outputs.run == 'true'
        env:
          AUDIT_OUT: artifacts/dashboard-browser-audit
        run: |
          DASHBOARD_HTML="dashboards/v9-pro-${DATE}.html" node tests/browser_dashboard_audit.mjs

      - name: Upload fresh-build browser audit evidence
        if: always() && steps.browser_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v9-dashboard-browser-audit-${{ github.run_id }}
          path: artifacts/dashboard-browser-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated dashboard history
        if: github.ref == 'refs/heads/phase2-p0-data-quality' || github.ref == 'refs/heads/phase2-p0-ui-fixes'
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "phase2-p0-data-quality" ] && [ "${GITHUB_REF_NAME}" != "phase2-p0-ui-fixes" ]; then
            echo "Refusing to commit generated dashboards outside approved P0 branches"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboards/
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit"
          else
            BIAS="$(python -c "import json; print(json.load(open('dashboards/data-${DATE}.json'))['analysis']['bias'])")"
            git commit -m "V9 Pro ${DATE} Bias ${BIAS}分"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Assemble isolated Pages site
        run: |
          set -euo pipefail
          rm -rf pages-site
          mkdir -p pages-site/p0
          cp -a master-site/dashboards/. pages-site/
          cp -a dashboards/. pages-site/p0/
          test -s pages-site/v9-pro-latest.html
          test -s pages-site/p0/v9-pro-latest.html
          echo "Master root and P0 subpath are both present"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/phase2-p0-data-quality'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
